[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enocean-mqtt"
version = "0.1.0.dev0"
description = "Modular EnOcean ESP3 busmonitor and MQTT gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "enocean-mqtt contributors" }
]
keywords = ["enocean", "mqtt", "esp3", "home-automation", "busmonitor"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "uvicorn>=0.30.0",
  "paho-mqtt>=2.0.0",
  "pyserial>=3.5",
  "pydantic>=2.8.0",
  "psutil>=5.9.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-psutil",
]
excel = [
  "openpyxl>=3.1.0"
]

[project.scripts]
enocean-mqtt = "enocean_mqtt.__main__:main"
enocean-devices = "enocean_mqtt.devices.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enocean_mqtt = [
  "py.typed",
  "web_api/templates/*.html",
  "web_api/static/*.png",
  "web_api/static/css/*.css",
  "web_api/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  ".ci-venv",
  ".pytest-tmp",
  "build",
  "dist",
  "testdata",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = [
  "^build/",
  "^dist/",
  '^\.venv/',
  '^\.ci-venv/',
  '^\.pytest-tmp/',
  "^testdata/",
]
