[build-system]
# Build tools only; runtime requirements belong in project.dependencies.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enocean-mqtt"
dynamic = ["version"]
# setup.py derives the distribution version from VERSION (SemVer unchanged).
description = "Modular EnOcean ESP3 busmonitor and MQTT gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "CREDITS.md"]
authors = [
  { name = "enocean-mqtt contributors" }
]
keywords = ["enocean", "mqtt", "esp3", "home-automation", "busmonitor"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "uvicorn>=0.30.0",
  "paho-mqtt>=2.0.0",
  "pyserial>=3.5",
  "pydantic>=2.8.0",
  "psutil>=5.9.0",
  "tzdata>=2024.1",
]

[project.scripts]
# Installed CLI entry points; the checkout root remains the working directory.
enocean-mqtt = "enocean_mqtt.__main__:main"
enocean-mqtt-auth = "enocean_mqtt.auth:main"
enocean-devices = "enocean_mqtt.devices.cli:main"

[project.urls]
Repository = "https://github.com/speckenbuettel/enocean-mqtt"
Documentation = "https://github.com/speckenbuettel/enocean-mqtt/blob/main/userguide/README.md"
Issues = "https://github.com/speckenbuettel/enocean-mqtt/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include Web UI resources in wheels, not just in editable checkout installs.
enocean_mqtt = [
  "py.typed",
  "web_api/templates/*.html",
  "web_api/static/*.png",
  "web_api/static/css/*.css",
  "web_api/static/js/*.js",
]
