name: Generate Status Lists

on:
  push:
    paths:
      - 'docs/eep-list.csv'
      - 'docs/device-list.csv'
      - 'docs/proprietary-profile-list.csv'
      - 'tools/generate_status_lists.py'
      - '.github/workflows/generate-status-lists.yml'

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate markdown status lists
        run: python tools/generate_status_lists.py

      - name: Commit generated markdown files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/eep-list.md docs/device-list.md docs/proprietary-profile-list.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-generate status list markdown"
          git push
